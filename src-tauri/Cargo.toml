[package]
name = "diorna"
version = "0.1.0"
description = "Diorna local-first knowledge and productivity suite"
authors = ["Diorna Contributors"]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"

[lib]
name = "diorna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
anyhow = "1.0.98"
base64 = "0.23.1"
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.3.1"
fs2 = "0.4.3"
futures = "0.3.31"
log = "0.4.27"
parking_lot = "0.12.4"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["charset", "http2", "rustls-tls", "stream"] }
rust_xlsxwriter = "0.100.0"
scraper = "0.27.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
tauri = { version = "2.7.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2.5.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.4.1"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-log = "=2.9.2"
tauri-plugin-notification = "2.3.0"
tauri-plugin-opener = "2.4.0"
tauri-plugin-persisted-scope = { version = "2.3.7", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-window-state = "2.4.0"
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = ["fs", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate", "time"] }
zeroize = "1.8.1"
tauri-plugin-process = "2.3.0"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
