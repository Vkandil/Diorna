name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Import Authenticode certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP 'diorna-signing.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          "TAURI_SIGNING_PRIVATE_KEY=$path" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - name: Build MSI and NSIS
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles msi,nsis
      - name: Create portable archive
        shell: pwsh
        run: |
          $release = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "$release/diorna.exe" "portable/Diorna.exe"
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md portable
          Compress-Archive portable/* "Diorna-${{ matrix.arch }}-portable.zip"
      - name: Checksums
        shell: pwsh
        run: Get-FileHash -Algorithm SHA256 (Get-ChildItem -Recurse src-tauri/target/${{ matrix.target }}/release/bundle/*/*,Diorna-${{ matrix.arch }}-portable.zip -File) | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "SHA256-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            Diorna-${{ matrix.arch }}-portable.zip
            SHA256-${{ matrix.arch }}.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            Diorna-${{ matrix.arch }}-portable.zip
            SHA256-${{ matrix.arch }}.txt
